<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Uiscore Bridge</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="img/uiscore-logo.svg" width="16" height="16" alt="">
    <h1>Uiscore Bridge</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Starting…</span></div>
  </header>
  <div class="meta" id="meta"></div>
  <div class="buttons">
    <button id="restart">Restart server</button>
    <button id="sample">Import sample job</button>
    <button id="openJobs">Open jobs folder</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="log"></div>
  <script src="js/main.js"></script>
</body>
</html>
